[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = ['npm ci']

[phases.build]
cmds = ['npm run build']

# Make environment variables available during build
[variables]
VITE_FACEBOOK_APP_ID = '$VITE_FACEBOOK_APP_ID'
VITE_FACEBOOK_APP_SECRET = '$VITE_FACEBOOK_APP_SECRET'
VITE_OPENAI_API_KEY = '$VITE_OPENAI_API_KEY'

[start]
cmd = 'npm start'
